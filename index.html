<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanoon.co | Fine Jewelry</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Playfair Display', Georgia, serif;
    }

    body {
      background-color: #fdfbf7;
      color: #2c2c2c;
    }

    header {
      background-color: #2b1414;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 20px;
    }

    .header-brand-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
    }

    .top-left-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      background-color: #2b1414;
      flex-shrink: 0;
    }

    .top-left-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 82% center;
      transform: scale(1.15);
    }

    .brand-name {
      color: #fdfbf7;
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 400;
    }

    /* Views container */
    .view-section {
      display: none;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .view-section.active {
      display: block;
    }

    /* Hero Section */
    .hero {
      background-color: #2b1414;
      background-image: linear-gradient(rgba(0, 0, 0, 0.40), rgba(0, 0, 0, 0.40)), url('product2.jpg');
      background-size: cover;
      background-position: center top;
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #ffffff;
      padding: 20px;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 400;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 1.1rem;
      font-style: italic;
      margin-bottom: 25px;
      opacity: 0.95;
    }

    .btn-shop {
      display: inline-block;
      padding: 12px 30px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
    }

    .btn-shop:hover {
      background-color: #ffffff;
      color: #2b1414;
    }

    /* Collection Grid */
    .collection h2 {
      font-size: 2.2rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #f0e6df;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    .card-img-container {
      width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
      font-weight: 400;
    }

    .card .price {
      color: #666;
      font-style: italic;
      margin-bottom: 15px;
    }

    /* Product Detail Page View */
    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      color: #2b1414;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    .product-detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .product-detail-layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }
    }

    /* Swipeable Image Slider for Details */
    .product-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      border-radius: 6px;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .product-slider::-webkit-scrollbar {
      height: 6px;
    }

    .product-slider::-webkit-scrollbar-thumb {
      background: #dcd6d0;
      border-radius: 3px;
    }

    .product-slider img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      flex-shrink: 0;
      scroll-snap-align: start;
      border-radius: 4px;
    }

    .detail-info h2 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 400;
    }

    .detail-info .price {
      font-size: 1.4rem;
      color: #555;
      font-style: italic;
      margin-bottom: 20px;
    }

    .detail-info .description {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 30px;
      font-family: Arial, sans-serif;
    }

    .detail-links {
      display: flex;
      gap: 15px;
    }

    .detail-links a {
      padding: 12px 24px;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      font-weight: 600;
      color: #fff;
      transition: opacity 0.2s;
    }

    .detail-links a:hover {
      opacity: 0.85;
    }

    .btn-wa { background-color: #25D366; }
    .btn-insta { background-color: #E1306C; }

    footer {
      text-align: center;
      padding: 30px;
      background: #2b1414;
      color: #888;
      font-size: 0.8rem;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="header-brand-container" onclick="showHome(); return false;">
      <div class="top-left-circle" title="Fanoon.co">
        <img src="product3.jpeg" alt="Fanoon Logo Icon">
      </div>
      <span class="brand-name">Fanoon.co</span>
    </a>
  </header>

  <!-- VIEW 1: HOME & COLLECTION -->
  <div id="home-view">
    <section class="hero">
      <h1>Chic. Bold. Iconic. Minimal.</h1>
      <p>A style for every occasion</p>
      <a href="#collection" class="btn-shop">SHOP COLLECTION</a>
    </section>

    <section class="view-section active collection" id="collection" style="display:block;">
      <h2>Our Collection</h2>
      <div class="grid" id="product-grid">
        <!-- Products injected via JavaScript -->
      </div>
    </section>
  </div>

  <!-- VIEW 2: PRODUCT DETAILS -->
  <div id="detail-view" class="view-section">
    <a href="#" class="back-btn" onclick="showHome(); return false;">&larr; Back to Collection</a>
    <div class="product-detail-layout">
      <div class="product-slider" id="detail-slider">
        <!-- Images injected via JavaScript -->
      </div>
      <div class="detail-info">
        <h2 id="detail-title"></h2>
        <p class="price" id="detail-price"></p>
        <p class="description" id="detail-desc"></p>
        <div class="detail-links">
          <a id="detail-wa" href="#" target="_blank" class="btn-wa">Order via WhatsApp</a>
          <a href="https://instagram.com/faanoon.co" target="_blank" class="btn-insta">Instagram</a>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Fanoon.co. All rights reserved.</p>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        title: "Moon Pendant",
        price: "Rs. 1,300",
        images: ["moon55.jpeg"],
        description: "A delicate and celestial moon pendant crafted with a polished finish. Perfect for everyday layering or adding a subtle minimalist sparkle to your outfit."
      },
      {
        id: 2,
        title: "Twisted Pave Hoop Earrings",
        price: "Rs. 1,500",
        images: ["PAVE.jpg", "PAVEE.jpg"],
        description: "Stunning twisted hoops embedded with glistening pave crystals. These earrings catch the light from every angle, blending bold structure with timeless elegance."
      },
      {
        id: 3,
        title: "The Bridgerton Necklace",
        price: "Rs. 1,450",
        images: ["pinkie.jpeg"],
        description: "Regency-era inspired statement piece designed to turn heads. Features ornate detailing and vintage charm fit for royalty."
      },
      {
        id: 4,
        title: "The Bridgerton Necklace (2)",
        price: "Rs. 1,450",
        images: ["pinkie2.jpeg"],
        description: "An alternate variation of our classic Bridgerton necklace, offering refined stonework and a graceful neckline drop."
      },
      {
        id: 5,
        title: "The Bridgerton Necklace (3)",
        price: "Rs. 1,450",
        images: ["pinkie3.jpeg"],
        description: "A gorgeous variant complete with cascading crystals, designed to complement evening wear and formal aesthetics."
      },
      {
        id: 6,
        title: "Crystal Choker",
        price: "Rs. 1,750",
        images: ["product9.jpg"],
        description: "A breathtaking crystal choker that hugs the collarbone gracefully. High brilliance stones set on a sleek profile."
      },
      {
        id: 7,
        title: "Dainty Seinna Earrings",
        price: "Rs. 1,800",
        images: ["black and white style one.PNG", "style one.PNG"],
        description: "Handcrafted with delicate detail, these Seinna earrings feature intricate filigree work and a graceful drop design. Perfect for adding a touch of vintage charm to any look."
      },
      {
        id: 8,
        title: "Isabella (chunky earrings)",
        price: "Rs. 1,950",
        images: ["black and white style 2 .PNG", "style two.PNG"],
        description: "Bold and striking chunky earrings designed to make a statement. Combining modern structure with timeless sophistication."
      },
      {
        id: 9,
        title: "Textured Cuff Bracelet",
        price: "Rs. 1,600",
        images: ["product11.jpg"],
        description: "An adjustable architectural cuff featuring a hammered metallic texture. Wear it solo or stack it with your favorite watch."
      },
      {
        id: 10,
        title: "Eternity Band Ring",
        price: "Rs. 2,100",
        images: ["product12.jpg"],
        description: "A continuous circle of sparkling stones symbolizing infinite style. Polished to perfection for a radiant shine."
      },
      {
        id: 11,
        title: "Golden Charm Bracelet",
        price: "Rs. 1,850",
        images: ["product13.jpg"],
        description: "A delicate link chain adorned with dainty golden charms that move with you throughout your day."
      },
      {
        id: 12,
        title: "Classic Hoop Earrings",
        price: "Rs. 1,500",
        images: ["product4.jpg"],
        description: "The ultimate wardrobe essential. Lightweight, polished gold hoops that effortlessly take you from day to night."
      }
    ];

    // Render the grid cards on load
    const gridEl = document.getElementById('product-grid');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => showProduct(p.id);
      card.innerHTML = `
        <div class="card-img-container">
          <img src="${p.images[0]}" alt="${p.title}">
        </div>
        <h3>${p.title}</h3>
        <p class="price">${p.price}</p>
      `;
      gridEl.appendChild(card);
    });

    function showProduct(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      // Populate details
      document.getElementById('detail-title').innerText = product.title;
      document.getElementById('detail-price').innerText = product.price;
      document.getElementById('detail-desc').innerText = product.description;
      
      // WhatsApp link prefilled
      const waMsg = encodeURIComponent(`Hi! I want to order ${product.title} (${product.price})`);
      document.getElementById('detail-wa').href = `https://wa.me/923345669379?text=${waMsg}`;

      // Populate swipeable images slider
      const sliderEl = document.getElementById('detail-slider');
      sliderEl.innerHTML = '';
      product.images.forEach(imgSrc => {
        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = product.title;
        sliderEl.appendChild(img);
      });

      // Toggle views
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('detail-view').classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHome() {
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('home-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
